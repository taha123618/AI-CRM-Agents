name: AI CRM CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-qa:
    name: Backend Lint, Type-Check & Pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_DB: ai_crm_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 black mypy

      - name: Lint with Flake8 & Black
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          black --check .

      - name: Run Backend Pytest Suite
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/ai_crm_test
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: test
        run: |
          PYTHONPATH=. pytest tests/ -v --cov=agents --cov=api --cov=database

  frontend-qa:
    name: Frontend Lint, Type-Check & Vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Run TypeScript Type-Check
        run: npm run type-check

      - name: Run Vitest Unit & Component Tests
        run: npm run test

      - name: Build Production SPA Bundle
        run: npm run build

  mobile-qa:
    name: Mobile Lint, Doctor, Type-Check & Export
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Mobile Dependencies
        run: bun install

      - name: Run Expo Doctor
        run: bunx expo-doctor

      - name: Run TypeScript Strict Check
        run: npx tsc --noEmit

      - name: Export Static Production Bundle (Expo Router)
        run: bunx expo export --platform web

  docker-build:
    name: Docker Multi-Stage Build Verification
    needs: [backend-qa, frontend-qa, mobile-qa]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ai-crm-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Nginx Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: ai-crm-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Mobile Nginx Image
        uses: docker/build-push-action@v5
        with:
          context: ./mobile
          file: ./mobile/Dockerfile
          push: false
          tags: ai-crm-mobile:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max


